server:
  port: ${API_GATEWAY_PORT:${PORT:8081}}

spring:
  application:
    name: api-gateway-sems
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: ${API_GATEWAY_TIMEOUT_SECONDS:30}s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.sems.apigateway.infrastructure.filters.RequestLoggingFilter: INFO

gateway:
  config-service:
    base-url: ${CONFIG_SERVICE_BASE_URL:http://localhost:8090}
    services-endpoint: ${CONFIG_SERVICE_SERVICES_ENDPOINT:/api/v1/config/services}
    gateway-endpoint: ${CONFIG_SERVICE_GATEWAY_ENDPOINT:/api/v1/config/api-gateway}
    refresh-interval-seconds: ${CONFIG_SERVICE_REFRESH_INTERVAL_SECONDS:0}
    retry:
      max-attempts: ${CONFIG_SERVICE_RETRY_MAX_ATTEMPTS:5}
      backoff-millis: ${CONFIG_SERVICE_RETRY_BACKOFF_MILLIS:1000}
  runtime:
    use-deploy-urls: ${API_GATEWAY_USE_DEPLOY_URLS:false}
  services:
    subscriptions-url: ${SUBSCRIPTIONS_SERVICE_URL:http://localhost:8082}
    analytics-url: ${ANALYTICS_SERVICE_URL:http://localhost:8004}
    device-management-url: ${DEVICE_MANAGEMENT_SERVICE_URL:http://localhost:8083}
    payments-url: ${PAYMENTS_SERVICE_URL:http://localhost:8085}
    alert-url: ${ALERT_SERVICE_URL:http://localhost:8085}
    iam-url: ${IAM_SERVICE_URL:http://localhost:8080}
    energy-monitoring-url: ${ENERGY_MONITORING_SERVICE_URL:http://localhost:8001}
  security:
    enabled: ${API_GATEWAY_AUTH_REQUIRED:${GATEWAY_SECURITY_ENABLED:false}}
    jwt:
      # Use one of the two options below when security is enabled.
      jwk-set-uri: ${GATEWAY_JWT_JWK_SET_URI:}
      secret: ${GATEWAY_JWT_SECRET:}
  cors:
    allowed-origins: ${API_GATEWAY_CORS_ALLOWED_ORIGINS:${GATEWAY_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173},http://localhost:4200}}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: ""
    allow-credentials: true
